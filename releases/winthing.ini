# WinThing command whitelist
# Format: identifier = "path/to/executable"
# Only commands listed here can be executed via the system/commands/run topic.

# Windows examples:
# notepad = "c:/windows/system32/notepad.exe"
# calculator = "c:/windows/system32/calc.exe"

# Linux/macOS examples:
# editor = "/usr/bin/nano"
# browser = "/usr/bin/firefox"
